<!DOCTYPE html>
<html>
  <head>
    <script src="https://unpkg.com/jspsych"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-html-swipe-response@2"></script>

    <script src="https://unpkg.com/@jspsych/plugin-maze"></script>
    <script src="../../jspsych-plugin-maze/index.browser.js"></script>

    <!-- Ugly trick to keep the data separate while not having to think of how to fetch it. See the
    jatos version for an example of how to use fetch -->
    <script src="../stimuli.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/jspsych/css/jspsych.css" />
  </head>

  <body></body>
  <script>

    const jsPsych = initJsPsych({
      on_finish: () => {
        jsPsych.data.displayData("json");
      },
    });

    const procedure = {
      timeline: [
        {
          type: jsPsychMaze,
          sentence: jsPsych.timelineVariable("sentence"),
        },
      ],
      timeline_variables: data,
    };

    jsPsych.run([procedure]);
  </script>
</html>
