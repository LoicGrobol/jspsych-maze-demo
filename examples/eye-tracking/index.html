<!DOCTYPE html>
<html>

<head>
	<script src="https://unpkg.com/jspsych"></script>
	<script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
	<script src="https://unpkg.com/@jspsych-contrib/plugin-html-swipe-response@2"></script>

	<!-- Saccade instructions from <https://saccade.jspsych.org/getting-started/> v1.0 2026-11-08-->
	<script src="https://unpkg.com/@saccadejs/core@1.0.0"></script>
	<script src="https://unpkg.com/@saccadejs/extension@1.0.0"></script>
	<script src="https://unpkg.com/@saccadejs/plugin-preview@1.0.0"></script>
	<script src="https://unpkg.com/@saccadejs/plugin-time-sync@1.0.0"></script>
	<script src="https://unpkg.com/@saccadejs/plugin-calibrate@1.0.0"></script>
	<script src="https://unpkg.com/@saccadejs/plugin-validate@1.0.0"></script>
	<script src="https://unpkg.com/@saccadejs/plugin-catch-up@v1.0.0"></script>

	<script src="https://unpkg.com/@jspsych/plugin-maze"></script>
	<script src="../../jspsych-plugin-maze/index.browser.js"></script>

	<!-- Ugly trick to keep the data separate while not having to think of how to fetch it. See the
	jatos version for an example of how to use fetch -->
	<script src="../stimuli.js"></script>

	<link rel="stylesheet" href="https://unpkg.com/jspsych/css/jspsych.css" />
</head>

<body></body>
<script>
	// Data-processing phase: all of this depends on how you manage your stimuli. This is an example
	// of how to select a random group of sentences and shuffles them.
	const jsPsych = initJsPsych({
		extensions: [{
			type: jsPsychExtensionSaccade, params: { mode: "auto" }
		}],
		on_finish: () => {
			jsPsych.data.displayData("json");
		},
	});
	const all_groups = [...new Set(data.map(({ group, ..._ }) => group))];
	const group = jsPsych.randomization.sampleWithoutReplacement(
		all_groups,
		1
	)[0];
	const trials = jsPsych.randomization.shuffle(
		data.filter(({ group: g, ..._ }) => group == g)
	);

	// Just to help people testing this demo, the plugin doesn't need instructions per se
	const instructions = {
		type: jsPsychInstructions,
		pages: [
			`Press <span style="color: red;">J</span> to advance.`,
			"In this experiment we are interested in seeing how quickly you<br>can decide what the best way is to continue a sentence.",
			"You will see two words, one on the left and one on the right.<br>One word will be obviously wrong.",
			"It is your job to decide which word is the correct continuation of the sentence.",
			`Press <span style="color: red;">F</span> if the correct answer is on the left, or <span style="color: red;">J</span> if the correct answer is on the right.`,
			"You should do this as quickly and accurately as possible.",
			"You will then answer a question about that sentence.",
			`When you are ready, press <span style="color: red;">J</span> to do a practice run.`,
		],
		allow_keys: true,
		key_backward: "f",
		key_forward: "j",
		show_clickable_nav: true,
	};

	// The actual maze experiment
	const procedure = {
		timeline: [
			{
				type: jsPsychMaze,
				sentence: jsPsych.timelineVariable("sentence"),
				inter_word_interval: 100,
				pre_answer_interval: 200,
				halt_on_error: true,
				post_trial_gap: 500,
				extensions: [
					{
						type: jsPsychExtensionSaccade,
						params: {
							targets: ["#jspsych-maze-left_display", "#jspsych-maze-right_display"]
						},
					},
				],
				on_finish: (data) => {
					// Convert to the same scale as t in saccade_data.
					data.events = data.events.map(
						(e) => {
							return {
								...e,
								display_saccade_time: e.display_atime - data.saccade_timing.trial_start,
								response_saccade_time: e.response_atime - data.saccade_timing.trial_start,
							}
						}
					);
				},
			},
			{
				type: jsPsychHtmlSwipeResponse,
				stimulus: () => jsPsych.evaluateTimelineVariable("question").text,
				keyboard_choices: ["f", "j"],
				button_choices: () => [
					jsPsych.evaluateTimelineVariable("question").left,
					jsPsych.evaluateTimelineVariable("question").right,
				],
				on_finish: (data) => {
					const correct_side =
						jsPsych.evaluateTimelineVariable("question").correct;
					let success;
					if (data.keyboard_response) {
						success = jsPsych.pluginAPI.compareKeys(
							data.keyboard_response,
							"left" === correct_side ? "f" : "j"
						);
					} else if (data.button_response) {
						success =
							data.button_response === ("left" === correct_side ? 0 : 1);
					} else {
						success = data.swipe_response === correct_side;
					}
					return { success: success };
				},
			},
		],
		timeline_variables: trials,
		data: { group: group },
	};

	jsPsych.run([
		// Ask for the camera, download the model, and let the participant line up their face.
		{ type: jsPsychSaccadePreview },
		// Measure the screen-to-camera delay and correct later timestamps for it.
		{ type: jsPsychSaccadeTimeSync },
		// Calibrate on 13 dots, then check accuracy on 9 more.
		{ type: jsPsychSaccadeCalibrate },
		{ type: jsPsychSaccadeValidate },
		// no instruction for the demo, the calibration is already long enough
		// instructions,
		procedure,
		// Get deferred gazes
		{ type: jsPsychSaccadeCatchUp },
	]);
</script>

</html>
